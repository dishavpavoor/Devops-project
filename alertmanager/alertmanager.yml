global:
  resolve_timeout: 1m
route:
  receiver: local-only
  group_by: [alertname, host]
  group_wait: 2s
  group_interval: 10s
  repeat_interval: 1h
receivers:
  - name: local-only
# Alerts are available in the local Alertmanager UI. Configure a receiver here
# before claiming email/Slack notifications; no messages are sent by default.
