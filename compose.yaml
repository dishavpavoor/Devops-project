name: sentinel
services:
  monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    image: sentinel-monitor:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      HOST_ID: ${HOST_ID:-demo-linux}
      MODEL_PATH: ${MODEL_PATH:-/app/artifacts/model.joblib}
      METRICS_SOURCE: ${METRICS_SOURCE:-local}
    tmpfs:
      - /demo-disk:size=24m,mode=1777
    volumes:
      - ./artifacts:/models:ro
    ports:
      - "127.0.0.1:8001:8001"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Copy .env.example to .env and set a password}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
